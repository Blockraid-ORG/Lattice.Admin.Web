version: "3.8"

services:
  launchpad-admin:
    container_name: launchpad-admin

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    networks:
      - production

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.launchpad-admin.rule=Host(`launchpad-admin.terravest.capital`)"
      - "traefik.http.routers.launchpad-admin.entrypoints=websecure"
      - "traefik.http.routers.launchpad-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.launchpad-admin.loadbalancer.server.port=5000"

networks:
  production:
    external: true